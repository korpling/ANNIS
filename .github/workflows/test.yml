name: Automated tests
on:
  push:
    branches: [main, staging, trying]
  pull_request:
    branches: [main]

jobs:
  test_jdk11:
    name: Execute all automated tests on JDK 11
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Otherwise the new code can't be determined or code coverage is less informing
          fetch-depth: 0
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-11-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-11-
      - name: Cache test corpora
        uses: actions/cache@v4
        with:
          path: "*.zip"
          key: ${{ runner.os }}-corpora-${{ hashFiles('misc/import-test-corpora.sh') }}
      - name: Set JAVA_HOME to included JDK 11
        run: echo JAVA_HOME=$JAVA_HOME_11_X64 >> $GITHUB_ENV
      - run: misc/download-annis-cli.sh
        env:
          OS_NAME: linux
      - run: misc/import-test-corpora.sh
      - name: Run Maven install (includes tests)
        run: mvn install
  test_jdk17:
    name: Execute all automated tests on JDK 21
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          # Otherwise the new code can't be determined or code coverage is less informing
          fetch-depth: 0
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-11-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-11-
      - name: Cache test corpora
        uses: actions/cache@v4
        with:
          path: "*.zip"
          key: ${{ runner.os }}-corpora-${{ hashFiles('misc/import-test-corpora.sh') }}
      - name: Set JAVA_HOME to included JDK 17
        run: echo JAVA_HOME=$JAVA_HOME_21_X64 >> $GITHUB_ENV
      - run: misc/download-annis-cli.sh
        env:
          OS_NAME: linux
      - run: misc/import-test-corpora.sh
      - name: Run Maven Tests with enabled code coverage and upload results to SonarCloud
        run: mvn -Pcoverage install org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=korpling_ANNIS -Dsonar.organization=korpling -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Check if the event is not triggered by a fork before attempting upload the test results
        # see https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#restrictions-on-repository-forks
        if: github.event.pull_request.head.repo.full_name == github.repository
      - name: Run Maven Tests without code coverage SonarCloud upload
        run: mvn install
        # Check if the event is triggered by a fork
        if: github.event.pull_request.head.repo.full_name != github.repository  

  test_docs:
    name: Test documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - run: misc/download-mdbook.sh 0.5.2
        env:
          OS_NAME: linux
      - run: mdbook build docs/user-guide/
      - run: mdbook build docs/developer-guide/
      - run: mdbook build docs/online-help/
